<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rectrix Caedere — Campaign Archives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Raleway:wght@300;400;500;600&family=Alegreya+Sans+SC:wght@400;500;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --rc-starless-navy:#050A0E; --rc-deep-blue-black:#111A24; --rc-midnight-cardstock:#0D141C;
  --rc-smoked-navy:#162230;
  --rc-burnished-copper:#68442F; --rc-aged-copper-gold:#8C5D3F; --rc-warm-amber:#AF755A;
  --rc-moonlit-apricot:#DA9565; --rc-soft-lunar-gold:#D9A064; --rc-pale-gold-text:#E8C690;
  --rc-product-gold:#C7A369; --rc-burnt-coral:#B7634D;
  --rc-text-primary:#E8E4DC; --rc-text-secondary:#9A9590; --rc-text-muted:#9A9590;
  --rc-text-vellum:#F5EFE2;
  --rc-border-accent:rgba(199,163,105,.25); --rc-border-accent-strong:rgba(199,163,105,.45);
  --rc-gold-glow:rgba(199,163,105,.30);
  --rc-success:#4A9E6E; --rc-info:#6B8AAD;
  --rc-font-display:'Cinzel','EB Garamond',serif;
  --rc-font-deco:'Cinzel Decorative','Cinzel',serif;
  --rc-font-body:'Raleway',system-ui,sans-serif;
  --rc-font-label:'Alegreya Sans SC','Raleway',sans-serif;
  --shadow-lg:0 8px 32px rgba(0,0,0,.55);
  --shadow-xl:0 22px 60px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--rc-font-body); color:var(--rc-text-primary);
  background:var(--rc-starless-navy);
  background-image:
    radial-gradient(120% 90% at 38% 18%, rgba(5,10,14,.10) 0%, rgba(5,10,14,.55) 55%, rgba(5,10,14,.86) 100%),
    url('./assets/img/general_background.webp');
  background-size:cover; background-position:center 35%; background-attachment:fixed;
  min-height:100vh; position:relative;
}
body.pre{overflow:hidden}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:70;opacity:.05;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}

.sound-btn{position:fixed;top:18px;right:18px;z-index:65;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--rc-border-accent-strong);background:rgba(13,20,28,.6);
  color:var(--rc-pale-gold-text);display:grid;place-items:center;cursor:pointer;
  backdrop-filter:blur(4px);transition:background .3s,border-color .3s,transform .25s,box-shadow .4s}
.sound-btn:hover{background:rgba(199,163,105,.2);border-color:var(--rc-product-gold);transform:scale(1.06)}
.sound-btn:focus-visible{outline:2px solid var(--rc-product-gold);outline-offset:3px}
.sound-btn svg{width:20px;height:20px}
.sound-btn .wave{transition:opacity .35s}
.sound-btn.muted .wave{opacity:.12}
.sound-btn.invite{animation:sbpulse 3s ease-in-out infinite}
@keyframes sbpulse{0%,100%{box-shadow:0 0 0 0 rgba(199,163,105,0)}50%{box-shadow:0 0 24px -4px var(--rc-gold-glow)}}

#veil{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:30px;
  background:radial-gradient(110% 90% at 50% 42%, rgba(5,10,14,.45) 0%, rgba(5,10,14,.82) 60%, rgba(5,10,14,.95) 100%);
  transition:opacity 1s ease, transform 1.1s cubic-bezier(.7,0,.3,1), filter 1.1s ease;}
body.crossed #veil{opacity:0;transform:scale(1.08);filter:blur(7px);pointer-events:none}
.veil-inner{max-width:680px;display:flex;flex-direction:column;align-items:center}
.veil-inner>*{opacity:0;transform:translateY(16px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.veil-inner>*:nth-child(1){animation-delay:.15s}
.veil-inner>*:nth-child(2){animation-delay:.55s}
.veil-inner>*:nth-child(3){animation-delay:1s}
.veil-inner>*:nth-child(4){animation-delay:1.5s}
@keyframes rise{to{opacity:1;transform:none}}
.veil-logo{height:clamp(118px,17vh,164px);width:auto;margin-bottom:24px;
  filter:drop-shadow(0 0 20px rgba(218,149,101,.4))}
.veil-l1{font-family:var(--rc-font-deco);font-weight:700;color:var(--rc-text-vellum);
  font-size:clamp(30px,6.5vw,56px);line-height:1.08;letter-spacing:.02em;
  text-shadow:0 2px 30px rgba(0,0,0,.7)}
.veil-l2{font-family:'EB Garamond',serif;font-style:italic;color:var(--rc-pale-gold-text);
  font-size:clamp(18px,3.4vw,27px);margin-top:22px;letter-spacing:.01em;opacity:.95}
.cross-btn{margin-top:48px;cursor:pointer;background:transparent;
  font-family:var(--rc-font-label);font-weight:700;font-size:14px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--rc-pale-gold-text);
  border:1px solid var(--rc-border-accent-strong);border-radius:3px;
  padding:17px 36px;position:relative;overflow:hidden;
  transition:color .4s ease, border-color .4s ease, box-shadow .4s ease}
.cross-btn::before{content:'';position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,var(--rc-soft-lunar-gold),var(--rc-warm-amber));
  transform:translateY(101%);transition:transform .45s cubic-bezier(.4,0,.2,1)}
.cross-btn:hover{color:var(--rc-starless-navy);border-color:var(--rc-soft-lunar-gold);
  box-shadow:0 0 32px -6px var(--rc-gold-glow)}
.cross-btn:hover::before{transform:translateY(0)}
.cross-btn:focus-visible{outline:2px solid var(--rc-product-gold);outline-offset:4px}
.cross-btn .flank{margin:0 14px;color:var(--rc-aged-copper-gold)}
.cross-btn:hover .flank{color:var(--rc-burnished-copper)}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(199,163,105,0)}50%{box-shadow:0 0 26px -8px var(--rc-gold-glow)}}

#archive{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:clamp(28px,5vh,72px) 20px 48px;
  opacity:0;visibility:hidden;transition:opacity .9s ease .35s, visibility 0s linear .35s}
body.crossed #archive{opacity:1;visibility:visible;transition:opacity .9s ease .35s}
header{text-align:center;max-width:760px;z-index:2;margin-bottom:clamp(26px,4vh,52px)}
.sigil-logo{height:62px;width:auto;margin:0 auto 14px;display:block;
  filter:drop-shadow(0 0 12px rgba(218,149,101,.3))}
.eyebrow{font-family:var(--rc-font-label);font-weight:500;font-size:12px;letter-spacing:.34em;
  text-transform:uppercase;color:var(--rc-product-gold);margin-bottom:14px}
.eyebrow::before,.eyebrow::after{content:'';display:inline-block;width:30px;height:1px;
  vertical-align:middle;margin:0 14px;background:linear-gradient(90deg,transparent,var(--rc-aged-copper-gold))}
.eyebrow::after{background:linear-gradient(90deg,var(--rc-aged-copper-gold),transparent)}
h1.title{font-family:var(--rc-font-deco);font-weight:700;color:var(--rc-text-vellum);
  font-size:clamp(30px,5.4vw,54px);line-height:1.04;letter-spacing:.02em;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.sub{margin-top:14px;font-family:var(--rc-font-body);font-weight:300;
  font-size:clamp(14px,2.2vw,17px);color:var(--rc-text-secondary)}
.sub em{font-family:var(--rc-font-display);font-style:normal;color:var(--rc-pale-gold-text)}
.deck{width:100%;max-width:1180px;z-index:2;
  display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(18px,2.4vw,34px);
  align-items:start;justify-items:center}
@media(max-width:1020px){.deck{grid-template-columns:repeat(2,1fr);max-width:620px;gap:30px}}
@media(max-width:480px){.deck{grid-template-columns:1fr;max-width:300px}}
.slot{width:100%;display:flex;flex-direction:column;align-items:center;gap:13px;
  opacity:0;transform:translateY(30px)}
body.crossed .slot{opacity:1;transform:none;
  transition:opacity .7s ease, transform .75s cubic-bezier(.2,.7,.2,1);
  transition-delay:calc(var(--i)*.13s + .45s)}
.card{position:relative;width:100%;aspect-ratio:440/703;border-radius:16px;
  perspective:1500px;cursor:pointer;
  transition:transform .5s cubic-bezier(.2,.7,.2,1), filter .4s ease}
.card__inner{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.45,.05,.2,1)}
.face{position:absolute;inset:0;border-radius:16px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:var(--shadow-lg);outline:1px solid rgba(199,163,105,.14);outline-offset:-1px;
  background:var(--rc-midnight-cardstock)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face--rest{transform:rotateY(0)}
.face--reveal{transform:rotateY(180deg)}
@media(hover:hover) and (pointer:fine){
  .slot[data-state="active"] .card:hover .card__inner,
  .slot[data-state="paused"] .card:hover .card__inner{transform:rotateY(180deg)}
}
.card:focus-visible .card__inner{transform:rotateY(180deg)}
.card.is-flipped .card__inner{transform:rotateY(180deg)}
.slot[data-state="active"] .card:hover,
.slot[data-state="paused"] .card:hover,
.slot[data-state="active"] .card:focus-within,
.slot[data-state="paused"] .card:focus-within{
  transform:translateY(-12px) scale(1.025);
  filter:drop-shadow(0 26px 44px rgba(0,0,0,.6)) drop-shadow(0 0 30px rgba(199,163,105,.18))}
.card:focus-visible{outline:none}
.slot[data-state="paused"] .face--reveal img{filter:saturate(.72) brightness(.84)}
.slot[data-state="coming-soon"] .card{cursor:default}
.slot[data-state="coming-soon"] .face img{filter:saturate(.5) brightness(.55)}
.ribbon{position:absolute;top:12px;right:-2px;z-index:4;
  font-family:var(--rc-font-label);font-weight:700;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;padding:5px 12px;color:#0b1118;border-radius:3px 0 0 3px;
  box-shadow:0 2px 8px rgba(0,0,0,.5)}
.ribbon--paused{background:var(--rc-info)}
.ribbon--soon{background:var(--rc-burnt-coral);color:var(--rc-text-vellum)}
.ribbon--finale{background:linear-gradient(180deg,var(--rc-moonlit-apricot),var(--rc-warm-amber));color:#0b1118}
.group-badge{position:absolute;left:11px;bottom:12px;z-index:4;
  height:clamp(36px,10%,48px);width:auto;pointer-events:none;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.6)) drop-shadow(0 0 9px rgba(0,0,0,.35));
  transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.slot[data-state="active"] .card:hover .group-badge,
.slot[data-state="paused"] .card:hover .group-badge,
.slot[data-state="active"] .card:focus-within .group-badge,
.slot[data-state="paused"] .card:focus-within .group-badge{transform:scale(1.06)}
.soon-plaque{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;
  font-family:var(--rc-font-label);font-weight:700;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--rc-pale-gold-text);text-align:center;
  background:rgba(13,20,28,.78);border:1px solid var(--rc-border-accent-strong);
  border-radius:5px;padding:12px 16px;line-height:1.5;backdrop-filter:blur(2px)}
.soon-plaque small{display:block;font-weight:400;font-size:9.5px;color:var(--rc-text-muted);margin-top:5px}
.cap{text-align:center;min-height:40px}
.cap .nm{font-family:var(--rc-font-display);font-weight:500;font-size:15px;letter-spacing:.04em;color:var(--rc-text-primary)}
.cap .meta{font-family:var(--rc-font-label);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--rc-text-muted);margin-top:4px;transition:color .3s}
.slot[data-state="active"] .card:hover ~ .cap .meta,
.slot[data-state="paused"] .card:hover ~ .cap .meta,
.slot[data-state="active"] .card:focus-within ~ .cap .meta,
.slot[data-state="paused"] .card:focus-within ~ .cap .meta{color:var(--rc-pale-gold-text)}
footer{margin-top:auto;padding-top:42px;text-align:center;z-index:2;
  font-family:var(--rc-font-label);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--rc-text-muted)}
footer .dot{color:var(--rc-aged-copper-gold);margin:0 8px}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(13,20,28,.94);border:1px solid var(--rc-border-accent-strong);
  color:var(--rc-pale-gold-text);font-family:var(--rc-font-body);font-size:13px;
  padding:11px 20px;border-radius:6px;opacity:0;pointer-events:none;z-index:80;
  transition:opacity .3s,transform .3s;box-shadow:var(--shadow-xl)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.001ms !important;animation:none !important}
  .veil-inner>*{opacity:1;transform:none} .slot{opacity:1;transform:none} .card{transform:none !important}
}
</style>
</head>
<body class="pre">

  <button id="sound" class="sound-btn muted invite" aria-label="Toggle ambient sound" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9 H7 L11 5 V19 L7 15 H4 Z" fill="currentColor" stroke="none"/>
      <path class="wave" d="M14.5 9.5 a3.6 3.6 0 0 1 0 5"/>
      <path class="wave" d="M17 7 a7 7 0 0 1 0 10"/>
    </svg>
  </button>

  <section id="veil">
    <div class="veil-inner">
      <img class="veil-logo" src="./assets/img/logo_only-transparent2.webp" alt="Rectrix Caedere">
      <h1 class="veil-l1">The veil is drawn.</h1>
      <p class="veil-l2">Will you cross the threshold?</p>
      <button id="cross" class="cross-btn"><span class="flank">&#10022;</span>I will cross<span class="flank">&#10022;</span></button>
    </div>
  </section>

  <div id="archive">
    <header>
      <img class="sigil-logo" src="./assets/img/logo_only-transparent2.webp" alt="Rectrix Caedere">
      <div class="eyebrow">Rectrix&nbsp;Caedere&nbsp;&middot;&nbsp;The&nbsp;Archives</div>
      <h1 class="title">Choose Your Path</h1>
      <p class="sub">Four campaigns. One deck. <em>Hover a card to turn it.</em></p>
    </header>
    <main class="deck" id="deck" aria-label="Campaign selection"></main>
    <footer>Rectrix Caedere <span class="dot">&#10022;</span> Campaign Archive <span class="dot">&#10022;</span> rectrixcaedere.com</footer>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

<script>
/* CONFIG
   LIVE : false = clicking a card shows a toast (the campaign sub-pages
          don't exist yet). Set TRUE once ./sky-is-the-limit/ etc. exist
          so the cards navigate for real.
   IMG  : art is served same-origin from /assets/img/ (WebP), cached by the
          GitHub Pages CDN. No external CDN dependency.                       */
const LIVE = true;
const IMG  = './assets/img/';
const img  = f => IMG + f;

const CAMPAIGNS = [
  { name:'Sky Is The Limit', arcana:'XVIII · The Moon', status:'active', inspired:true,
    face:'Sky_tarot_face.webp', href:'./sky-is-the-limit/' },
  { name:'Pacts & Power', arcana:'XVI · The Tower', status:'active', flag:'finale', inspired:true,
    face:'pacts_tarot_face.webp', href:'./pacts-and-power/' },
  { name:'Where the Flowers Remember', arcana:'X · The Wheel of Fortune', status:'paused', inspired:true,
    face:'wtfr_tarot_face.webp', href:'./where-the-flowers-remember/' },
  { name:'Ashfall Britannia', arcana:'XIII · Death', status:'active',
    face:'ashfall_britannia_tarot_face.webp', href:'./ashfall-britannia/' }
];
const STATUS_LABEL = {active:'Active', paused:'Paused', 'coming-soon':'Coming soon'};
const canHover = matchMedia('(hover:hover) and (pointer:fine)').matches;

const deck=document.getElementById('deck'), toast=document.getElementById('toast');
let toastTimer;
function go(c){
  if(LIVE){ window.location.href=c.href; return; }
  toast.textContent='\u21A6  Entering '+c.name+'   ('+c.href+')';
  toast.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),2200);
}
CAMPAIGNS.forEach((c,i)=>{
  const live=c.status!=='coming-soon';
  const slot=document.createElement('div');
  slot.className='slot'; slot.dataset.state=c.status; slot.style.setProperty('--i',i);
  const ribbon=c.flag==='finale'?`<div class="ribbon ribbon--finale">Finale</div>`:(c.status==='active'?'':`<div class="ribbon ribbon--${c.status==='paused'?'paused':'soon'}">${STATUS_LABEL[c.status]}</div>`);
  const revealFace=live?`<div class="face face--reveal"><img src="${img(c.face)}" alt="${c.name} tarot card" loading="lazy"></div>`:'';
  const badge=c.inspired?`<img class="group-badge" src="${img('flame_dragon_emblem.webp')}" alt="" role="img" aria-label="Part of the Inspired R&R group" title="Part of the Inspired R&R group" loading="lazy">`:'';
  const soon=c.status==='coming-soon'?`<div class="soon-plaque">Coming&nbsp;Soon<small>Art in progress</small></div>`:'';
  slot.innerHTML=`
    <div class="card" tabindex="${live?0:-1}" role="${live?'button':'img'}" aria-label="${live?('Enter '+c.name):(c.name+' \u2014 coming soon')}">
      ${ribbon}
      ${badge}
      <div class="card__inner">
        <div class="face face--rest">
          <img src="${img('tarotcard_back.webp')}" alt="${live?'Face-down tarot card':(c.name+' \u2014 card not yet revealed')}" loading="lazy">
          ${soon}
        </div>
        ${revealFace}
      </div>
    </div>
    <div class="cap"><div class="nm">${c.name}</div><div class="meta">${c.flag==='finale'?'Finale \u00B7 '+c.arcana:(c.status==='paused'?'Paused \u00B7 '+c.arcana:c.arcana)}</div></div>`;
  const card=slot.querySelector('.card');
  if(live){
    card.addEventListener('click',()=>{
      if(!canHover && !card.classList.contains('is-flipped')){ card.classList.add('is-flipped'); return; }
      go(c);
    });
    card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(c); }});
  }
  deck.appendChild(slot);
});

document.getElementById('cross').addEventListener('click',()=>{
  document.body.classList.add('crossed'); document.body.classList.remove('pre');
  setTimeout(()=>{ const v=document.getElementById('veil'); if(v) v.style.display='none'; },1200);
});

/* ATMOSPHERIC AUDIO (synthesized; no external files) */
let AC, master, started=false, muted=false; const TARGET=0.18;
const soundBtn=document.getElementById('sound');
function buildAudio(){
  const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return false;
  AC=new Ctx(); master=AC.createGain(); master.gain.value=0;
  const comp=AC.createDynamicsCompressor();
  comp.threshold.value=-18; comp.knee.value=24; comp.ratio.value=8; comp.attack.value=0.02; comp.release.value=0.4;
  master.connect(comp); comp.connect(AC.destination);
  const bed=AC.createGain(); bed.gain.value=0.5;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=480; lp.Q.value=4;
  bed.connect(lp); lp.connect(master);
  [[55,'sine',0.5,0],[82.41,'triangle',0.18,7],[110,'sine',0.12,-6]].forEach(([f,t,g,det])=>{
    const o=AC.createOscillator(); o.type=t; o.frequency.value=f; o.detune.value=det;
    const gn=AC.createGain(); gn.gain.value=g; o.connect(gn); gn.connect(bed); o.start();
  });
  const f1=AC.createOscillator(); f1.frequency.value=0.045;
  const f1g=AC.createGain(); f1g.gain.value=170; f1.connect(f1g); f1g.connect(lp.frequency); f1.start();
  const s1=AC.createOscillator(); s1.frequency.value=0.06;
  const s1g=AC.createGain(); s1g.gain.value=0.13; s1.connect(s1g); s1g.connect(bed.gain); s1.start();
  const deep=AC.createGain(); deep.gain.value=0.8; deep.connect(master);
  const sub=AC.createOscillator(); sub.type='sine'; sub.frequency.value=41.2;
  const subG=AC.createGain(); subG.gain.value=0.4; sub.connect(subG); subG.connect(deep); sub.start();
  const subLfo=AC.createOscillator(); subLfo.frequency.value=0.05;
  const subLfoG=AC.createGain(); subLfoG.gain.value=0.2; subLfo.connect(subLfoG); subLfoG.connect(subG.gain); subLfo.start();
  const dread=AC.createOscillator(); dread.type='sine'; dread.frequency.value=51.91;
  const dreadG=AC.createGain(); dreadG.gain.value=0.1; dread.connect(dreadG); dreadG.connect(deep); dread.start();
  const rlen=AC.sampleRate*6, rb=AC.createBuffer(1,rlen,AC.sampleRate), rd=rb.getChannelData(0);
  let lastB=0; for(let i=0;i<rlen;i++){ const wn=Math.random()*2-1; lastB=(lastB+0.02*wn)/1.02; rd[i]=lastB*3.2; }
  const rumble=AC.createBufferSource(); rumble.buffer=rb; rumble.loop=true;
  const rlp=AC.createBiquadFilter(); rlp.type='lowpass'; rlp.frequency.value=110; rlp.Q.value=0.7;
  const rg=AC.createGain(); rg.gain.value=0.42; rumble.connect(rlp); rlp.connect(rg); rg.connect(deep);
  const rlfo=AC.createOscillator(); rlfo.frequency.value=0.03;
  const rlfoG=AC.createGain(); rlfoG.gain.value=40; rlfo.connect(rlfoG); rlfoG.connect(rlp.frequency); rlfo.start();
  rumble.start();
  const len=AC.sampleRate*5, b=AC.createBuffer(1,len,AC.sampleRate), ch=b.getChannelData(0);
  for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
  const n=AC.createBufferSource(); n.buffer=b; n.loop=true;
  const nf=AC.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=300; nf.Q.value=0.6;
  const ng=AC.createGain(); ng.gain.value=0.05; n.connect(nf); nf.connect(ng); ng.connect(master);
  const w1=AC.createOscillator(); w1.frequency.value=0.07;
  const w1g=AC.createGain(); w1g.gain.value=130; w1.connect(w1g); w1g.connect(nf.frequency); w1.start();
  n.start(); return true;
}
function fade(to,t){ if(AC) master.gain.setTargetAtTime(to,AC.currentTime,t); }
function updateSound(){ soundBtn.classList.toggle('muted',muted||!started);
  soundBtn.setAttribute('aria-pressed',String(started&&!muted)); }
function ensureStart(){
  if(started) return;
  if(!AC){ if(!buildAudio()) return; }
  started=true; if(AC.resume) AC.resume();
  if(!muted) fade(TARGET,2.4);
  soundBtn.classList.remove('invite'); updateSound();
}
soundBtn.addEventListener('click',e=>{
  e.stopPropagation();
  if(!started){ ensureStart(); return; }
  muted=!muted; fade(muted?0:TARGET,muted?0.5:1.4); updateSound();
});
function firstGesture(e){
  if(e.target&&e.target.closest&&e.target.closest('#sound')) return;
  ensureStart();
  ['pointerdown','keydown','touchstart'].forEach(ev=>window.removeEventListener(ev,firstGesture));
}
['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,firstGesture));
updateSound();
</script>
</body>
</html>
